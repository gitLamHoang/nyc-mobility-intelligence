[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nyc-mobility-intelligence"
version = "0.1.0"
description = "Reproducible one-hour-ahead NYC yellow taxi pickup demand forecasting"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.2,<2", "pandas>=2.2,<3", "pyarrow>=19,<24",
  "numpy>=2,<3", "scikit-learn>=1.6,<2", "matplotlib>=3.9,<4",
  "geopandas>=1,<2", "joblib>=1.4,<2", "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1", "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
nyc-mobility = "nyc_mobility.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nyc_mobility"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
